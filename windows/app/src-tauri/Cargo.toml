[package]
name = "claude-board"
# 실제 버전은 windows/VERSION 한 곳에서 관리한다(build.rs 가 읽어 CLAUDE_BOARD_VERSION 으로 넣는다)
version = "0.0.0"
description = "Claude Board for Windows — 세션 보드·알림 패널"
edition = "2021"
publish = false

[lib]
name = "app_lib"

[[bin]]
name = "ClaudeBoard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
claude-board-core = { path = "../../crates/core" }
# macos-private-api — 개발 기기(macOS)에서 투명 창을 확인하려고 켠다. Windows 빌드에는 영향이 없다
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Windows 대상에서 C 컴파일러가 필요한 ring(rustls) 대신 OS 의 TLS(SChannel·Security.framework)를 쓴다
ureq = { version = "3", default-features = false, features = ["native-tls"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# tauri 가 이미 쓰는 판과 맞춘다(같은 crate 를 두 번 빌드하지 않게)
window-vibrancy = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
