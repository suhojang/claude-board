[package]
name = "claude-board-core"
# 실제 버전은 windows/VERSION 한 곳에서 관리한다(hook 의 build.rs 가 읽는다)
version = "0.0.0"
edition = "2021"
publish = false
description = "Claude Board 파일 약속·hook 상태 규칙·hook 등록·경로·프로세스 도구"

[lib]
name = "claude_board_core"

[dependencies]
# preserve_order — settings.json 을 다시 쓸 때 사용자의 키 순서를 바꾸지 않는다(세션 파일도 state.py 와 같은 순서)
serde_json = { version = "1.0.149", features = ["preserve_order"] }
regex = "1.12.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
