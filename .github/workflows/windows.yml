# Claude Board for Windows — 빌드·테스트, 실제 Windows 설치 확인(smoke), 자동 릴리스 (windows/docs/SPEC.md 8.3)
# 릴리스는 태그 windows-v<버전> 으로 만들고 절대 Latest 로 표시하지 않는다(--latest=false).
# 설치된 macOS 앱이 releases/latest/download/... 를 읽으므로 Windows 릴리스가 Latest 가 되면 macOS 업데이트가 깨진다(SPEC 0.1).
name: windows

on:
  push:
    branches: ['**']   # 태그 push 에는 돌지 않는다
    paths:
      - 'windows/**'
      - 'plugins/md-render/**'   # 자산에 싣는 플러그인
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'plugins/md-render/**'
      - '.github/workflows/windows.yml'
  # 손으로 돌리기 — 기본은 dry run(릴리스 작업의 모든 확인을 하고 만들 명령만 보여 준다). 실제 릴리스(dry_run=false)는 main 에서만
  #   gh workflow run windows.yml --ref <브랜치> -f dry_run=true
  workflow_dispatch:
    inputs:
      dry_run:
        description: '릴리스를 만들지 않고 확인만 한다 (false 는 main 에서만 실제 릴리스)'
        type: boolean
        default: true

# 같은 브랜치의 이전 실행은 취소한다 — main 은 릴리스 도중 끊기지 않게 취소하지 않는다
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            windows -> target
            windows/app/src-tauri -> target

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/app/package-lock.json

      # windows/VERSION(예: 2.12)이 버전의 단일 출처 — Tauri 는 semver 가 필요하므로 2.12 → 2.12.0
      - name: 버전 읽기
        id: ver
        run: |
          v="$(tr -d '[:space:]' < windows/VERSION)"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::windows/VERSION 이 버전 숫자가 아닙니다: $v"
            exit 1
          fi
          case "$v" in
            *.*.*) semver="$v" ;;
            *.*) semver="$v.0" ;;
            *) semver="$v.0.0" ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "Claude Board for Windows $v ($semver)"

      # push 마다 릴리스 설명이 될 항목을 미리 확인한다 — release 작업·packaging/release.sh 와 같은 awk 규칙
      - name: 변경 내역 항목 확인
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          notes="$(awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' windows/CHANGELOG.md)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::windows/CHANGELOG.md 에 '## $VERSION' 항목이 없습니다."
            exit 1
          fi
          echo "----- windows/CHANGELOG.md '## $VERSION' 항목 -----"
          printf '%s\n' "$notes"

      # md-render 플러그인 검사 - claude plugin validate/test 는 세션·로그인·네트워크가 필요 없다(비밀값 없음).
      # 버전은 정확히 고정한다(2.1.287 이상이 필요하고, 원 저장소 CI 가 같은 버전으로 통과한다). 올릴 때는 이 숫자만 바꾼다
      - name: Claude Code 설치 (플러그인 검사용)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.288
          claude --version

      - name: md-render 검사 (저장소 경로)
        run: |
          claude plugin validate plugins/md-render --strict
          claude plugin test plugins/md-render

      # 설치 폴더는 한글·공백이 든 경로일 수 있다(C:\Users\홍 길동\AppData\Local\Programs\Claude Board). 같은 검사를 그런 경로에 복사해 돌려
      # Claude Code 가 그 경로의 플러그인 모듈을 읽는지 확인한다. 저장소 사본은 건드리지 않게 통째로(tests 포함) 복사한다
      - name: md-render 검사 (한글·공백 경로 사본)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = 'C:\Temp\한글 폴더\md-render'
          Remove-Item -LiteralPath (Split-Path -Parent $dst) -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'plugins\md-render\*') -Destination $dst -Recurse -Force
          Get-ChildItem -LiteralPath $dst -Recurse -File | ForEach-Object { Write-Host $_.FullName }
          claude plugin validate $dst --strict
          if ($LASTEXITCODE -ne 0) { throw "claude plugin validate 가 실패했습니다(종료 코드 $LASTEXITCODE): $dst" }
          claude plugin test $dst
          if ($LASTEXITCODE -ne 0) { throw "claude plugin test 가 실패했습니다(종료 코드 $LASTEXITCODE): $dst" }

      - name: core·hook 테스트
        working-directory: windows
        run: cargo test --workspace

      - name: core·hook clippy
        working-directory: windows
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: hook 빌드
        working-directory: windows
        run: cargo build --release -p claude-board-hook

      # tauri.conf.json 의 externalBin "binaries/claude-board-hook" 은 대상 이름이 붙은 파일을 찾는다.
      # Tauri 는 설치할 때 이름에서 대상 이름을 떼어 $INSTDIR\claude-board-hook.exe 로 둔다
      - name: hook 을 sidecar 자리에 두기
        run: |
          mkdir -p windows/app/src-tauri/binaries
          cp windows/target/release/claude-board-hook.exe \
             windows/app/src-tauri/binaries/claude-board-hook-x86_64-pc-windows-msvc.exe

      - name: 프론트엔드 의존성
        working-directory: windows/app
        run: npm ci

      # 타입·svelte 검사와 프론트엔드 단위 시험(node --test, Node 22.18+ 는 .ts 를 바로 읽는다)
      - name: 프론트엔드 검사
        working-directory: windows/app
        run: npm run check

      - name: 프론트엔드 테스트
        working-directory: windows/app
        run: npm test

      # 버전은 JSON 파일로 넘긴다 — npx 가 Windows 에서 cmd.exe 를 거치므로 따옴표가 든 JSON 문자열은 깨지기 쉽다
      - name: 앱·설치 프로그램(NSIS) 빌드
        working-directory: windows/app
        env:
          SEMVER: ${{ steps.ver.outputs.semver }}
        run: |
          cfg="$(cygpath -m "$RUNNER_TEMP")/tauri-version.json"
          printf '{"version":"%s"}\n' "$SEMVER" > "$cfg"
          npx tauri build --bundles nsis --config "$cfg"

      # 백엔드 clippy·단위 테스트 — 위 빌드가 만든 프론트엔드 결과(../build)와 sidecar 가 있어야 컴파일된다
      - name: 백엔드 clippy
        working-directory: windows/app/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: 백엔드 테스트
        working-directory: windows/app/src-tauri
        run: cargo test

      # 릴리스 자산(SPEC 8.1): zip·sha256·setup.exe·install.ps1·uninstall.ps1·VERSION
      - name: 릴리스 자산 묶기
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = $env:GITHUB_WORKSPACE
          $dist = Join-Path $ws 'windows\dist'
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          $pkg = Join-Path $env:RUNNER_TEMP 'claude-board-pkg'
          Remove-Item $pkg -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dist, $pkg | Out-Null

          Copy-Item (Join-Path $ws 'windows\app\src-tauri\target\release\ClaudeBoard.exe') $pkg
          Copy-Item (Join-Path $ws 'windows\target\release\claude-board-hook.exe') $pkg
          Copy-Item (Join-Path $ws 'LICENSE') $pkg
          Copy-Item (Join-Path $ws 'windows\README.md') $pkg
          Copy-Item (Join-Path $ws 'windows\packaging\THIRD_PARTY_NOTICES.txt') $pkg

          # md-render 플러그인 - 실행에 필요한 다섯 파일만 이름으로 골라 plugins\md-render\ 아래 같은 상대 경로로 둔다
          # (macOS 의 build-board.sh·make-dmg.sh 와 같다. tests\ 와 Claude Code 가 만드는 tsconfig.json·.claude-plugin\types\ 는 싣지 않는다).
          # setup.exe 도 같은 자리에 둔다(Tauri bundle resources). 보드가 시작할 때 이 폴더를 %USERPROFILE%\.claude\notifier\plugins\md-render 로 옮겨 쓴다
          foreach ($f in @('LICENSE', 'README.md', '.claude-plugin\plugin.json', 'hooks\hooks.json', 'hooks\register.tsx')) {
            $to = Join-Path $pkg "plugins\md-render\$f"
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $to) | Out-Null
            Copy-Item -LiteralPath (Join-Path $ws "plugins\md-render\$f") -Destination $to
          }

          $zipName = 'ClaudeBoard-windows-x64.zip'
          $zip = Join-Path $dist $zipName
          Compress-Archive -Path (Join-Path $pkg '*') -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          # BOM 없는 UTF-8 한 줄: "<sha256>  ClaudeBoard-windows-x64.zip"
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $zipName`n", (New-Object System.Text.UTF8Encoding $false))

          # Tauri 가 만드는 이름(<productName>_<semver>_x64-setup.exe)을 릴리스 이름으로 바꾼다
          $setup = @(Get-ChildItem (Join-Path $ws 'windows\app\src-tauri\target\release\bundle\nsis') -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw "NSIS 설치 프로그램을 하나만 찾아야 하는데 $($setup.Count)개입니다." }
          Copy-Item $setup[0].FullName (Join-Path $dist "ClaudeBoard-$env:VERSION-setup.exe")

          Copy-Item (Join-Path $ws 'windows\packaging\install.ps1') $dist
          Copy-Item (Join-Path $ws 'windows\packaging\uninstall.ps1') $dist
          Copy-Item (Join-Path $ws 'windows\VERSION') $dist
          Get-ChildItem $dist | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      - uses: actions/upload-artifact@v7
        with:
          name: claude-board-windows
          path: windows/dist/*
          if-no-files-found: error

  # 실제 Windows 러너에서 build 의 자산을 깔고 지워 본다(windows/ci/). 러너는 일회용 VM 이라 실제 %USERPROFILE%·HKCU 를 쓴다.
  # 설치 확인이 실패하면 이 작업이 실패해 release 가 나가지 않는다. 화면 확인은 정보용(continue-on-error)이라 릴리스를 막지 않는다
  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: claude-board-windows
          path: dist

      # setup.exe /S 설치 → 등록된 hook 을 가짜 Claude Code 아래에서 실행 → 같은 버전 다시 설치·제자리 제거 → 제거 → install.ps1·uninstall.ps1(PS 5.1)
      - name: 설치 확인
        run: ./windows/ci/install-checks.ps1 -Assets dist -Results smoke-results

      # 보드 창·단일 실행·알림 패널(포커스를 가져가지 않는지·확장 스타일)·스크린샷 — 설치 확인이 실패해도 정보를 얻으려고 돌린다
      - name: 화면 확인 (정보용)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./windows/ci/screen-checks.ps1 -Assets dist -Results smoke-results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-results
          path: smoke-results/
          if-no-files-found: ignore

  # 실제 릴리스: main 의 push, 또는 main 에서 workflow_dispatch(dry_run=false).
  # dry run(workflow_dispatch 기본값): 아래 확인을 모두 하고 실행할 gh 명령만 보여 준다 — 아무것도 만들지 않는다
  release:
    needs: [build, smoke]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: claude-board-windows
          path: dist

      - name: 릴리스 방식 정하기
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = push ]; then
            dry=false
          elif [ "$DRY_RUN_INPUT" = false ]; then
            if [ "$REF" != refs/heads/main ]; then
              echo "::error::실제 릴리스(dry_run=false)는 main 에서만 할 수 있습니다: $REF"
              exit 1
            fi
            dry=false
          else
            dry=true
          fi
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT ref=$REF dry_run=$dry"

      - name: 버전·태그 확인
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          file_version="$(tr -d '[:space:]' < dist/VERSION)"
          if [ -z "$VERSION" ] || [ "$file_version" != "$VERSION" ]; then
            echo "::error::빌드 버전($VERSION)과 자산 VERSION($file_version)이 다릅니다."
            exit 1
          fi
          tag="windows-v$VERSION"
          exists=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            exists=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "버전 $VERSION · 태그 $tag · 이미 있음: $exists"

      # packaging/release.sh 와 같은 규칙 — windows/CHANGELOG.md 의 "## <버전>" 항목을 릴리스 설명으로 쓴다
      - name: 릴리스 설명(변경 내역 항목)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' windows/CHANGELOG.md > "$notes"
          if [ -z "$(tr -d '[:space:]' < "$notes")" ]; then
            echo "::error::windows/CHANGELOG.md 에 '## $VERSION' 항목을 먼저 쓰세요."
            exit 1
          fi
          echo "----- 릴리스 설명 -----"
          cat "$notes"

      # SPEC 8.1 의 자산과 정확히 같은지, sha256 이 zip 과 맞는지, zip 안의 파일이 맞는지 확인한다
      - name: 릴리스 자산 확인
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          expected="ClaudeBoard-$VERSION-setup.exe
          ClaudeBoard-windows-x64.zip
          ClaudeBoard-windows-x64.zip.sha256
          VERSION
          install.ps1
          uninstall.ps1"
          expected="$(printf '%s\n' "$expected" | sed 's/^ *//' | LC_ALL=C sort)"
          actual="$(cd dist && find . -type f | sed 's|^\./||' | LC_ALL=C sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::릴리스 자산이 SPEC 8.1 과 다릅니다."
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          (cd dist && sha256sum -c ClaudeBoard-windows-x64.zip.sha256)
          # 폴더 항목(끝이 /)은 빼고 파일만 센다
          zip_files="$(unzip -Z1 dist/ClaudeBoard-windows-x64.zip | grep -v '/$' | LC_ALL=C sort)"
          want_zip="$(printf '%s\n' ClaudeBoard.exe LICENSE README.md THIRD_PARTY_NOTICES.txt claude-board-hook.exe \
            plugins/md-render/LICENSE plugins/md-render/README.md plugins/md-render/.claude-plugin/plugin.json \
            plugins/md-render/hooks/hooks.json plugins/md-render/hooks/register.tsx | LC_ALL=C sort)"
          if [ "$zip_files" != "$want_zip" ]; then
            echo "::error::zip 안의 파일이 SPEC 8.1 과 다릅니다."
            printf '%s\n' "$zip_files"
            exit 1
          fi
          ls -l dist

      - name: 릴리스 만들기 (Latest 아님)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          EXISTS: ${{ steps.tag.outputs.exists }}
          DRY: ${{ steps.mode.outputs.dry }}
        run: |
          cmd=(gh release create "$TAG"
               "dist/ClaudeBoard-windows-x64.zip" "dist/ClaudeBoard-windows-x64.zip.sha256"
               "dist/ClaudeBoard-$VERSION-setup.exe" "dist/install.ps1" "dist/uninstall.ps1" "dist/VERSION"
               --repo "$GITHUB_REPOSITORY"
               --title "Claude Board for Windows $VERSION"
               --notes-file "$RUNNER_TEMP/notes.md"
               --latest=false
               --target "$GITHUB_SHA")
          echo "실행할 명령:"
          printf '%q ' "${cmd[@]}"
          echo
          if [ "$DRY" = true ]; then
            [ "$EXISTS" = true ] && echo "(실제 실행이었다면 $TAG 가 이미 있어 건너뛰었습니다)"
            echo "dry run — 릴리스를 만들지 않았습니다."
          elif [ "$EXISTS" = true ]; then
            echo "$TAG 가 이미 있어 릴리스를 건너뜁니다."
          else
            "${cmd[@]}"
            echo "released: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          fi
